# Personagem de exemplo do Waifu Scam.
# Copie esta pasta para characters/private/<seu-id>/ para criar a sua (fica fora do Git).

name = "Lumi"
language = "pt-BR"
persona = "persona.md"

[minecraft]
username = "Lumi"         # nome de player no jogo: 3 a 16 letras, números ou _

[skin]
# Escolha uma das duas formas (ou nenhuma, para a skin padrão):
# username = "NomeDeUmaConta"   # copia a skin atual de uma conta do Minecraft
# file = "skin.png"              # PNG 64x64 nesta pasta; precisa de MINESKIN_API_KEY no .env
model = "slim"                   # "slim" (braços finos) ou "classic"

[needs]
# Pesos de 0 a 2: o quanto ela se importa com cada necessidade (fase 5)
hunger = 1.0
safety = 1.2
energy = 1.0
social = 1.5
progress = 0.8
comfort = 1.3
curiosity = 1.0

[chat]
greeting = "oi gente! cheguei"   # o que ela fala ao entrar no mundo
proactive_interval = 60   # segundos mínimos entre falas espontâneas
typing_speed = 12         # caracteres por segundo, para parecer que está digitando

[world]
fair_play = false         # false = raio-x liberado
commands = true
permission_level = 2

[llm]
provider_order = ["groq", "gemini", "openrouter"]
chat_model = ""           # vazio = padrão do provedor
plan_model = ""
