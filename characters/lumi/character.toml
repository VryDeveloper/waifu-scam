# Personagem de exemplo do Waifu Scam.
# Copie esta pasta para characters/private/<seu-id>/ para criar a sua (fica fora do Git).

name = "Lumi"
language = "pt-BR"
persona = "persona.md"

[minecraft]
username = "Lumi"         # nome de player no jogo: 3 a 16 letras, números ou _

[skin]
# Escolha uma das duas formas (ou nenhuma, para a skin padrão):
# username = "NomeDeUmaConta"   # copia a skin atual de uma conta do Minecraft
# file = "skin.png"              # PNG 64x64 nesta pasta; precisa de MINESKIN_API_KEY no .env
model = "slim"                   # "slim" (braços finos) ou "classic"

[needs]
# Pesos de 0 a 2: o quanto ela se importa com cada necessidade. Entram no prompt
# ("o que você mais quer agora") e mudam o que ela escolhe fazer sozinha.
hunger = 1.0
safety = 1.2
energy = 1.0
social = 1.5
progress = 0.8
comfort = 1.3
curiosity = 1.0

[will]
# Vontade própria (fase 5): o que ela faz quando ninguém pede nada.
enabled = true
think_every = 180         # segundos parada até decidir sozinha o que fazer (gasta 1 chamada de IA)
shelter_at_night = true   # cava um abrigo quando anoitece e ela está ao ar livre
hungry_think_every = 180  # com fome e sem comida, pensa no que fazer a cada N segundos

[chat]
greeting = "oi gente! cheguei"   # o que ela fala ao entrar no mundo
proactive_interval = 60   # segundos mínimos entre falas espontâneas
typing_speed = 12         # caracteres por segundo, para parecer que está digitando

[world]
fair_play = false         # false = raio-x liberado
commands = true
permission_level = 2

[llm]
# Ordem de tentativa; provedores sem chave no .env são pulados.
provider_order = ["groq", "gemini", "openrouter"]
chat_model = ""           # vazio = padrão de cada provedor (ou <PROVEDOR>_MODEL no .env)
temperature = 0.9         # 0.5 = mais contida, 1.0 = mais solta
daily_limit = 800         # máximo de chamadas de IA por dia (o plano grátis do Groq dá ~1.000)
