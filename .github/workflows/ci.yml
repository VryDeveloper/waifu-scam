name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mind:
    name: Mente (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mind
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mind/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  mod:
    name: Corpo (mod Fabric)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: waifuscam-mod
          path: mod/build/libs/
